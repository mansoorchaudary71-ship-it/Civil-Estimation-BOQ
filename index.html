<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Civil Estimation Pro: free construction quantity, BOQ and cost estimation calculators for concrete, steel, masonry, finishes, earthworks and more." />
    <meta name="theme-color" content="#F2A413" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F1D1A" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Single Page Apps for GitHub Pages: restore the path that 404.html
         saved as a query string (?/brick-calculator) back to a real path.
         Pairs with public/404.html. Required now that the app uses
         BrowserRouter (clean URLs) instead of HashRouter. -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>

    <!-- Apply the saved theme BEFORE first paint (previously the page flashed light, then switched). -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('app-settings');
          var t = (raw && JSON.parse(raw).theme) || 'system';
          var root = document.documentElement;
          if (t === 'high-contrast') root.classList.add('high-contrast');
          else if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) root.classList.add('dark');
          else root.classList.add('light');
          if (t === 'modern') root.classList.add('theme-modern');
          if (t === 'engineering-blueprint') root.classList.add('theme-blueprint');
        } catch (e) {}
      })();
    </script>

    <link rel="preload" href="/fonts/MonaSans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Single font request (the same font was also @import-ed in index.css). Fewer weights = smaller payload. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Civil Estimation Pro | BOQ &amp; Construction Cost Calculators</title>
  </head>
  <body class="overflow-x-clip w-full m-0 p-0 antialiased bg-white dark:bg-[#1F1D1A] text-[#1F1D1A] dark:text-[#F5F2EC]">
    <noscript>Civil Estimation Pro needs JavaScript enabled to run its calculators.</noscript>
    <div id="root" class="overflow-x-clip w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
